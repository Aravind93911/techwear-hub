<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - TechWear Hub</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    body > main {
      background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background-color: var(--card-background);
      width: 100%;
      max-width: 480px;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <nav class="container-fluid" style="position: absolute; top: 0; width: 100%; z-index: 10;">
    <ul><li><strong style="color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">TechWear Hub</strong></li></ul>
    <ul id="navLinks">
      <li><a href="index.html" style="color: white;">Home</a></li>
      <li><a href="shop.html" style="color: white;">Shop</a></li>
      <li><a href="login.html" role="button" class="outline contrast">Login</a></li>
      <li><a href="cart.html" style="color: white;">Cart</a></li>
      <li><a href="admin.html" style="color: white;">Admin</a></li>
    </ul>
  </nav>

  <main>
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Welcome Back</h2>
        <p style="color: var(--muted-color);">Sign in to manage your orders.</p>
      </div>

      <form onsubmit="userLogin(event)">
        <label for="username">Username / Email</label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required />
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required />
        
        <div class="grid" style="font-size: 0.8rem; margin-bottom: 1rem; align-items: center;">
            <label><input type="checkbox"> Remember me</label>
            <a href="#" style="text-align: right; color: var(--primary);">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" class="contrast">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted-color);">
        Don't have an account? <a href="register.html" style="color: var(--primary);">Create Account</a>
      </div>
    </div>
  </main>

  <script>
    // --- CONFIGURE EMAILJS ---
    (function(){
       // 1. PASTE YOUR PUBLIC KEY HERE
       emailjs.init("YOUR_PUBLIC_KEY_HERE"); 
    })();

    // 2. PASTE YOUR SERVICE & TEMPLATE IDs HERE
    const SERVICE_ID = "YOUR_SERVICE_ID";
    const TEMPLATE_ID = "YOUR_TEMPLATE_ID";
    const ADMIN_EMAIL = "your_own_email@gmail.com"; // Where Admin alerts go

    function userLogin(event) {
        event.preventDefault(); 
        
        const userVal = document.getElementById('username').value;
        const passVal = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        // --- A. SQL INJECTION CHECK (Send to Admin) ---
        const cleanUser = userVal.toUpperCase();
        const sqlPatterns = ["' OR 1=1", "' OR '1'='1", "UNION SELECT", "DROP TABLE", "--"];
        
        if (sqlPatterns.some(pattern => cleanUser.includes(pattern))) {
            alert("⚠️ SECURITY ALERT: SQL Injection Attempt Detected!");
            
            // Log locally
            let attackLogs = JSON.parse(localStorage.getItem('simulatedAttacks')) || [];
            attackLogs.push({ time: new Date().toLocaleTimeString(), ip: "192.168.1.105", query: userVal, type: "SQL Injection" });
            localStorage.setItem('simulatedAttacks', JSON.stringify(attackLogs));

            // Send Email to ADMIN
            sendEmail(ADMIN_EMAIL, "🚨 SQL Injection Alert", `Attack detected using query: ${userVal}`);
            return;
        }

        // --- B. AUTHENTICATION CHECK ---

        // 1. Check Admin
        if (userVal === 'admin' && passVal === 'admin123') {
            localStorage.setItem('currentUser', 'Administrator');
            window.location.href = 'profile.html';
            return;
        }

        // 2. Check Registered Users
        let userDB = JSON.parse(localStorage.getItem('techWearUsers')) || [];
        
        // Find if the username exists at all
        const targetUser = userDB.find(u => u.username === userVal);

        if (targetUser) {
            // User exists, check password
            if (targetUser.password === passVal) {
                // SUCCESS
                localStorage.setItem('currentUser', targetUser.username);
                window.location.href = 'profile.html'; 
            } else {
                // FAILED: Wrong Password -> ALERT THE USER!
                alert("❌ Login Failed: Incorrect Password.");
                
                console.log(`Sending security alert to: ${targetUser.email}`);
                
                // Send Email to THE USER (not Admin)
                sendEmail(
                    targetUser.email, 
                    "⚠️ Security Alert: Failed Login Attempt", 
                    `Hello ${targetUser.username}, someone tried to access your account with an incorrect password.`
                );
            }
        } else {
            // User does not exist
            alert("❌ Login Failed: Username not found.");
        }
    }

    // --- REUSABLE EMAIL FUNCTION ---
    function sendEmail(toEmail, subject, message) {
        const btn = document.getElementById('loginBtn');
        btn.innerText = "Sending Alert...";
        
        const params = {
            to_email: toEmail,  // This matches {{to_email}} in your template
            subject: subject,   // You need {{subject}} in your template subject line
            message: message,   // You need {{message}} in your template body
            ip: "192.168.1.105 (Simulated)"
        };

        emailjs.send(SERVICE_ID, TEMPLATE_ID, params)
            .then(function() {
                console.log("Email sent successfully to " + toEmail);
                btn.innerText = "Sign In";
            }, function(error) {
                console.log("Email failed", error);
                btn.innerText = "Sign In";
            });
    }
  </script>

</body>
</html>
