<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - TechWear Hub</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    /* Cart Styling Updates */
    h2, h3, h4, h5 { color: #e0e0e0 !important; }

    .cart-item {
        background-color: var(--card-background);
        padding: 1.5rem;
        border-bottom: 1px solid #30363d;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        border-radius: 6px;
    }
    .cart-item span:first-child { font-weight: bold; font-size: 1.1rem; color: white; }
    .cart-item span:nth-child(2) { color: #00bcd4; font-weight: bold; }

    .cart-total {
        margin-top: 2rem;
        font-size: 1.8rem;
        font-weight: 800;
        text-align: right;
        color: #00bcd4;
    }
    
    /* Input Visibility Fixes */
    dialog article { background-color: var(--card-background); color: white; border: 1px solid #444; }
    textarea, input, select { background-color: #0d1117 !important; color: white !important; border-color: #30363d !important; }
    
    .phone-group { display: flex; align-items: center; }
    .phone-prefix {
        background-color: #21262d; border: 1px solid #30363d; color: #ccc;
        padding: 0.75rem; border-radius: 4px 0 0 4px; font-weight: bold;
    }
  </style>
</head>
<body>

  <nav class="container-fluid">
    <ul><li><strong>TechWear Hub</strong></li></ul>
    <ul id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="cart.html" role="button" class="outline contrast">Cart</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <main class="container">
    <h2>Your Shopping Cart</h2>
    
    <div id="loginStatus" style="margin-bottom: 1rem; color: #888; font-size: 0.9rem;">
        Checking status...
    </div>
    
    <section id="cartList">
        <p>Loading cart...</p>
    </section>

    <div class="cart-total" id="cartTotal">Total: ₹0</div>

    <hr style="border-color: #333;">
    
    <div class="grid">
        <button id="checkoutBtn" onclick="openCheckout()" class="contrast">Proceed to Checkout</button>
        <button class="secondary outline" onclick="clearCart()">Empty Cart</button>
    </div>
  </main>

  <dialog id="checkoutModal">
    <article>
      <header>
        <a href="#close" aria-label="Close" class="close" onclick="closeCheckout()"></a>
        <h3>Secure Checkout</h3>
      </header>
      
      <form onsubmit="processOrder(event)">
        <h5>Shipping Details</h5>
        <label for="address">Full Address</label>
        <textarea id="address" placeholder="House No, Street, City, Pincode" required></textarea>

        <label for="phone">Phone Number</label>
        <div class="phone-group">
            <span class="phone-prefix">+91</span>
            <input type="tel" id="phone" placeholder="98765 43210" pattern="[0-9]{10}" required>
        </div>

        <h5 style="margin-top: 1.5rem;">Payment Method</h5>
        <label for="cardName">Name on Card</label>
        <input type="text" id="cardName" placeholder="ARAVIND K" required>

        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>

        <div class="grid">
            <div>
                <label for="expiry">Expiry Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
            </div>
            <div>
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" placeholder="123" maxlength="3" required>
            </div>
        </div>

        <footer>
          <button type="button" class="secondary" onclick="closeCheckout()">Cancel</button>
          <button type="submit" id="payBtn">Pay <span id="payAmount"></span></button>
        </footer>
      </form>
    </article>
  </dialog>

  <script>
    // --- LOAD CART ---
    document.addEventListener('DOMContentLoaded', () => {
        // Debug Check: Are we logged in?
        const currentUser = localStorage.getItem('currentUser');
        const statusDiv = document.getElementById('loginStatus');
        if (currentUser) {
            statusDiv.innerHTML = `Signed in as: <strong style="color:#2ea043">${currentUser}</strong>`;
        } else {
            statusDiv.innerHTML = `Status: <strong style="color:#f85149">Guest (Not Logged In)</strong>`;
        }

        const cartList = document.getElementById('cartList');
        const cartTotal = document.getElementById('cartTotal');
        
        let cart = JSON.parse(localStorage.getItem('techWearCart')) || [];

        if (cart.length === 0) {
            cartList.innerHTML = '<p style="color:#888">Your cart is empty. <a href="shop.html">Go Shop!</a></p>';
            cartTotal.style.display = 'none';
            document.getElementById('checkoutBtn').disabled = true; // Disable button if empty
            return;
        }

        let html = '';
        let total = 0;
        
        cart.forEach((product, index) => {
            let price = parseFloat(product.price) || 0; 
            total += price;
            let priceString = price.toLocaleString('en-IN');

            html += `
                <div class="cart-item">
                    <span>${product.name}</span>
                    <span>₹${priceString}</span>
                    <a href="#" onclick="removeItem(${index})" style="color:#f44336; margin-left:1rem; font-size:0.9rem; text-decoration:none">Remove</a>
                </div>
            `;
        });

        cartList.innerHTML = html;
        const totalString = "₹" + total.toLocaleString('en-IN');
        cartTotal.innerText = `Total: ${totalString}`;
        
        const payBtnText = document.getElementById('payAmount');
        if(payBtnText) payBtnText.innerText = totalString;
    });

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('techWearCart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('techWearCart', JSON.stringify(cart));
        window.location.reload();
    }

    function clearCart() {
        if(confirm("Clear your cart?")) {
            localStorage.removeItem('techWearCart');
            window.location.reload();
        }
    }

    // --- 🔒 THE SECURITY CHECK ---
    function openCheckout() {
        console.log("Attempting checkout...");

        // 1. Check Login
        const currentUser = localStorage.getItem('currentUser');
        console.log("Current User:", currentUser);

        if (!currentUser) {
            // ALERT AND BLOCK
            alert("🔒 ACCESS DENIED\n\nYou must create an account or login to purchase items.");
            window.location.href = 'login.html';
            return; // STOP HERE
        }

        // 2. Open if Logged In
        document.getElementById('checkoutModal').setAttribute('open', true);
    }

    function closeCheckout() {
        document.getElementById('checkoutModal').removeAttribute('open');
    }

    function processOrder(event) {
        event.preventDefault();
        const payBtn = document.getElementById('payBtn');
        payBtn.setAttribute('aria-busy', 'true');
        payBtn.innerText = 'Processing Payment...';

        setTimeout(() => {
            alert("Payment Successful! Your order has been placed.");
            localStorage.removeItem('techWearCart');
            closeCheckout();
            window.location.href = 'profile.html';
        }, 2000);
    }
  </script>
</body>
</html>
