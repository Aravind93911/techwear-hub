<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - TechWear Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* --- CUSTOM STYLES --- */
    
    /* Force main headings to be dark and visible */
    h2, h3, h4, h5 {
        color: #111 !important; /* Dark Black */
    }

    /* Cart Item Container */
    .cart-item {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0; /* Light grey separator */
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff; /* Ensure white background */
    }

    /* Product Name */
    .cart-item span:first-child {
        color: #000;       /* Solid Black */
        font-weight: bold;
        font-size: 1.1rem;
    }

    /* Price Tag */
    .cart-item span:nth-child(2) {
        color: #333;       /* Dark Grey */
        font-weight: bold;
    }

    /* Total Price Area */
    .cart-total {
        margin-top: 2rem;
        font-size: 1.5rem;
        font-weight: 800;
        text-align: right;
        color: #000;       /* Solid Black */
    }
    
    /* Phone Input Styling */
    .phone-group {
        display: flex;
        align-items: center;
    }
    .phone-prefix {
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        color: #333;
        padding: 0.75rem;
        border-radius: 4px 0 0 4px;
        font-weight: bold;
    }
    .phone-input {
        border-radius: 0 4px 4px 0 !important;
        flex-grow: 1;
        color: #000; /* Ensure typed number is visible */
    }
    
    /* Fix text color inside modals/forms */
    dialog article, form label, input, textarea {
        color: #111;
    }

    /* Modal Styling */
    dialog article {
        width: 100%;
        max-width: 600px;
        background-color: white; /* Force white card */
        color: black;
    }
  </style>
</head>
<body>

  <nav class="container-fluid">
    <ul><li><strong>TechWear Hub</strong></li></ul>
    <ul id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="profile.html" id="loginLink">Login</a></li>
      <li><a href="cart.html" role="button" class="outline">Cart</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <main class="container">
    <h2>Your Cart</h2>
    
    <section id="cartList">
        <p style="color:#333">Loading cart...</p>
    </section>

    <div class="cart-total" id="cartTotal"></div>

    <hr>
    
    <div class="grid">
        <button onclick="openCheckout()" class="contrast">Proceed to Checkout</button>
        <button class="secondary outline" onclick="clearCart()">Empty Cart</button>
    </div>
  </main>

  <dialog id="checkoutModal">
    <article>
      <header>
        <a href="#close" aria-label="Close" class="close" onclick="closeCheckout()"></a>
        <h3 style="margin-bottom:0">Secure Checkout</h3>
      </header>
      
      <form onsubmit="processOrder(event)">
        <h5>Shipping Details</h5>
        <label for="address">Full Address</label>
        <textarea id="address" placeholder="House No, Street, City, Pincode" required style="background:white; border:1px solid #ccc; color:black;"></textarea>

        <label for="phone">Phone Number</label>
        <div class="phone-group">
            <span class="phone-prefix">+91</span>
            <input type="tel" id="phone" class="phone-input" placeholder="98765 43210" pattern="[0-9]{10}" title="Please enter a valid 10-digit number" required style="background:white; border:1px solid #ccc; color:black;">
        </div>

        <h5 style="margin-top: 1.5rem;">Payment Method</h5>
        <label for="cardName">Name on Card</label>
        <input type="text" id="cardName" placeholder="ARAVIND K" required style="background:white; border:1px solid #ccc; color:black;">

        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required style="background:white; border:1px solid #ccc; color:black;">

        <div class="grid">
            <div>
                <label for="expiry">Expiry Date</label>
                <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required style="background:white; border:1px solid #ccc; color:black;">
            </div>
            <div>
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" placeholder="123" maxlength="3" required style="background:white; border:1px solid #ccc; color:black;">
            </div>
        </div>

        <footer>
          <button type="button" class="secondary" onclick="closeCheckout()">Cancel</button>
          <button type="submit" id="payBtn">Pay & Place Order</button>
        </footer>
      </form>
    </article>
  </dialog>

  <script src="js/main.js"></script>
  
  <script>
    // --- CART PAGE LOGIC ---
    document.addEventListener('DOMContentLoaded', () => {
        const cartList = document.getElementById('cartList');
        const cartTotal = document.getElementById('cartTotal');
        
        let cart = JSON.parse(localStorage.getItem('techWearCart')) || [];

        if (cart.length === 0) {
            cartList.innerHTML = '<p style="color:#666">Your cart is empty. Go <a href="shop.html">shopping</a>!</p>';
            cartTotal.style.display = 'none';
            return;
        }

        let html = '';
        let total = 0;
        
        cart.forEach((product, index) => {
            let price = parseFloat(product.price) || 0; 
            total += price;

            html += `
                <div class="cart-item">
                    <span>${product.name}</span>
                    <span>$${price.toFixed(2)}</span>
                    <a href="#" onclick="removeItem(${index})" style="color:#e53935; font-weight:bold; font-size:0.9em; margin-left:1rem; text-decoration:none;">Remove</a>
                </div>
            `;
        });

        cartList.innerHTML = html;
        cartTotal.innerText = `Total: $${total.toFixed(2)}`;
    });

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('techWearCart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('techWearCart', JSON.stringify(cart));
        window.location.reload();
    }

    function clearCart() {
        if(confirm("Are you sure you want to empty your cart?")) {
            localStorage.removeItem('techWearCart');
            window.location.reload();
        }
    }

    // --- CHECKOUT LOGIC ---
    function openCheckout() {
        let cart = JSON.parse(localStorage.getItem('techWearCart')) || [];
        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }
        const modal = document.getElementById('checkoutModal');
        modal.setAttribute('open', true);
    }

    function closeCheckout() {
        const modal = document.getElementById('checkoutModal');
        modal.removeAttribute('open');
    }

    function processOrder(event) {
        event.preventDefault();
        const payBtn = document.getElementById('payBtn');
        payBtn.setAttribute('aria-busy', 'true');
        payBtn.innerText = 'Processing Payment...';

        setTimeout(() => {
            alert("Payment Successful! Your order has been placed.");
            localStorage.removeItem('techWearCart');
            closeCheckout();
            window.location.href = 'profile.html';
        }, 2000);
    }
  </script>
</body>
</html>
