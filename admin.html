<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Security Operations Center</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0d1117;
}

/* LOGIN OVERLAY */
#login-overlay {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ADMIN LAYOUT */
.admin-layout {
    display: none;
    height: 100vh;
    grid-template-columns: 260px 1fr;
}

/* SIDEBAR */
.sidebar {
    background: #161b22;
    border-right: 1px solid #30363d;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
}

.sidebar a {
    display: block;
    padding: 0.75rem 1rem;
    color: #8b949e;
    text-decoration: none;
    border-radius: 6px;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: 0.2s;
}

.sidebar a:hover {
    background: #21262d;
    color: white;
}

.sidebar a.active {
    background: #1f6feb;
    color: white;
    font-weight: bold;
}

/* CONTENT */
.content {
    padding: 2rem;
    overflow-y: auto;
}

/* STATS */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: #161b22;
    padding: 1.5rem;
    border: 1px solid #30363d;
    border-radius: 8px;
    text-align: center;
}

.stat-number {
    font-size: 2rem;
    font-weight: bold;
    margin-top: 0.5rem;
}

/* TABLES */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 0.75rem;
    border-bottom: 1px solid #30363d;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="login-overlay">
    <article style="background:#161b22; border:1px solid #30363d; width:400px; padding:2rem;">
        <h3 style="text-align:center; margin-bottom:2rem;">SECURE ACCESS</h3>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="Username" required autocomplete="off">
            <input type="password" id="adminPass" placeholder="Password" required autocomplete="off">
            <button type="submit" class="contrast">Authenticate</button>
        </form>
    </article>
</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel" class="admin-layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <h4 style="color:white;">SOC Dashboard</h4>
        <hr>

        <nav>
            <a id="nav-dashboard" class="active" onclick="switchTab('dashboard')">📊 Overview</a>
            <a id="nav-logs" onclick="switchTab('logs')">📜 Attack Logs</a>
        </nav>

        <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid #30363d;">
            <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                <input type="checkbox" id="protectionToggle" role="switch">
                <span id="protectionLabel" style="font-weight:bold; font-size:0.85rem;">
                    SQL PROTECTION: OFF
                </span>
            </label>
        </div>

        <div style="margin-top:auto;">
            <a href="index.html">🏠 Back to Home</a>
            <a onclick="adminLogout()" style="color:#f85149;">🚪 Logout</a>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">

        <!-- ===== DASHBOARD TAB ===== -->
        <div id="tab-dashboard" class="tab-content active">

            <h2>Live Threat Monitoring</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Requests</div>
                    <div class="stat-number" id="totalReq">0</div>
                </div>

                <div class="stat-card">
                    <div style="color:#f85149;">Threats Blocked</div>
                    <div class="stat-number" id="blockedReq">0</div>
                </div>
            </div>

            <article style="background:#161b22; padding:1rem; border-radius:8px;">
                <strong>Real-Time Activity</strong>
                <div style="max-height:350px; overflow-y:auto; margin-top:1rem;">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>IP</th>
                                <th>Query</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="realtimeLogBody"></tbody>
                    </table>
                </div>
            </article>

            <div style="height:300px; margin-top:2rem;">
                <canvas id="trafficChart"></canvas>
            </div>

        </div>

        <!-- ===== LOG TAB ===== -->
        <div id="tab-logs" class="tab-content">
            <h2>Security Logs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>IP</th>
                        <th>Query</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>

    </main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
