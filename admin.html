<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Admin Panel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="overlay">
    <div class="login-card">
        <h3>SECURE ACCESS</h3>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="Username" required>
            <input type="password" id="adminPass" placeholder="Password" required>
            <button type="submit" class="contrast">Authenticate</button>
        </form>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-layout hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h4>SOC Dashboard</h4>

        <nav>
            <a data-tab="overview" class="active">📊 Overview</a>
            <a data-tab="users">👥 User Management</a>
            <a data-tab="logs">📜 Attack Logs</a>
            <a data-tab="ai">🤖 AI Training</a>
        </nav>

        <div class="toggle-box">
            <label>
                <input type="checkbox" id="sqlToggle">
                <span id="toggleLabel">SQL PROTECTION: OFF</span>
            </label>
        </div>

        <div class="sidebar-footer">
            <a href="index.html">🏠 Home</a>
            <a id="logoutBtn">🚪 Logout</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <!-- OVERVIEW -->
        <section id="overview" class="tab active">
            <h2>Live Threat Monitoring</h2>

            <div class="stats">
                <div class="card">
                    <h4>Total Requests</h4>
                    <p id="totalRequests">0</p>
                </div>
                <div class="card">
                    <h4>Threats Blocked</h4>
                    <p id="blockedRequests">0</p>
                </div>
            </div>

            <div class="card">
                <h4>Real-Time Activity</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>IP</th>
                            <th>Query</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="liveTable"></tbody>
                </table>
            </div>

            <div class="chart-box">
                <canvas id="trafficChart"></canvas>
            </div>
        </section>

        <!-- USERS -->
        <section id="users" class="tab">
            <h2>User Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </section>

        <!-- LOGS -->
        <section id="logs" class="tab">
            <h2>Attack Logs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>IP</th>
                        <th>Payload</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logTable"></tbody>
            </table>
        </section>

        <!-- AI -->
        <section id="ai" class="tab">
            <h2>AI Model Training</h2>
            <button id="trainBtn" class="contrast">Start Training</button>
            <div class="progress">
                <div id="progressBar"></div>
            </div>
        </section>

    </main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
