<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Security Operations Center</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .admin-layout { display: none; height: 100vh; grid-template-columns: 250px 1fr; }
        .sidebar { background: #161b22; border-right: 1px solid #30363d; padding: 2rem 1rem; display: flex; flex-direction: column; }
        .sidebar a { display: block; padding: 0.75rem 1rem; color: #8b949e; text-decoration: none; border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .sidebar a:hover { background: #21262d; color: white; }
        .sidebar a.active { background: #1f6feb; color: white; font-weight: bold; }
        .content { padding: 2rem; overflow-y: auto; background: #0d1117; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: #161b22; padding: 1.5rem; border: 1px solid #30363d; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #58a6ff; margin: 0.5rem 0; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; border-bottom: 1px solid #30363d; padding: 1rem; color: #8b949e; }
        td { padding: 1rem; border-bottom: 1px solid #21262d; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-overlay">
        <article style="background: #161b22; border: 1px solid #30363d; width: 400px; padding: 2rem;">
            <h3 style="text-align: center; margin-bottom: 2rem;">SECURE ACCESS</h3>
            <form onsubmit="adminLogin(event)">
                <input type="text" id="adminUser" placeholder="Enter Username" required>
                <input type="password" id="adminPass" placeholder="Enter Password" required>
                <button type="submit" class="contrast">Authenticate</button>
            </form>
        </article>
    </div>

    <div id="adminPanel" class="admin-layout">
        <aside class="sidebar">
            <h4 style="color: white; padding-left: 1rem;">SOC Dashboard</h4>
            <hr style="margin: 1rem 0; border-color: #30363d;">
            <nav>
                <a onclick="switchTab('dashboard')" id="nav-dashboard" class="active">📊 Overview</a>
                <a onclick="switchTab('users')" id="nav-users">👥 User Management</a>
                <a onclick="switchTab('logs')" id="nav-logs">📜 Attack Logs</a>
            </nav>

            <div style="padding: 1rem; border-top: 1px solid #30363d; margin-top: 1rem;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="protectionToggle" role="switch" onchange="toggleProtection()">
                    <span id="protectionLabel" style="font-weight: bold; font-size: 0.8rem;">SQL PROTECTION: OFF</span>
                </label>
            </div>

            <div style="margin-top: auto;">
                <a onclick="adminLogout()" style="color: #f85149; cursor:pointer">🚪 Logout</a>
            </div>
        </aside>

        <main class="content">
            <div id="tab-dashboard" class="tab-content active">
                <h2>Live Threat Monitoring</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div>Total Requests</div><div class="stat-number" id="totalReq">0</div></div>
                    <div class="stat-card"><div>Threats Blocked</div><div class="stat-number" id="blockedReq" style="color:#f85149">0</div></div>
                </div>
                <article style="background: #161b22; border: 1px solid #30363d; padding: 0;">
                    <header style="padding: 1rem; border-bottom: 1px solid #30363d;"><strong>Real-Time Activity</strong></header>
                    <table role="grid"><tbody id="realtimeLogBody"></tbody></table>
                </article>
            </div>

            <div id="tab-users" class="tab-content">
                <h2>User Database & Credentials</h2>
                <table role="grid">
                    <thead><tr><th>ID</th><th>Username</th><th>Password (Hash)</th><th>Address</th><th>Status</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>

            <div id="tab-logs" class="tab-content">
                <h2>Security Incident Logs</h2>
                <table role="grid">
                    <thead><tr><th>Time</th><th>IP Address</th><th>Query</th><th>Threat</th><th>Action</th></tr></thead>
                    <tbody id="logBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let totalRequests = 0;
        let blockedThreats = 0;

        // --- PERSISTENCE: Check state on every load ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedState = localStorage.getItem('sqlProtectionState') === 'true'; //
            updateToggleUI(savedState); //

            if (localStorage.getItem('adminSession') === 'active') {
                showDashboard();
            }
        });

        function toggleProtection() {
            const checkbox = document.getElementById('protectionToggle');
            localStorage.setItem('sqlProtectionState', checkbox.checked); // Save state
            updateToggleUI(checkbox.checked); // Update UI
        }

        function updateToggleUI(isActive) {
            const label = document.getElementById('protectionLabel');
            const checkbox = document.getElementById('protectionToggle');
            if (label) {
                label.innerText = isActive ? "SQL PROTECTION: ON" : "SQL PROTECTION: OFF"; //
                label.style.color = isActive ? "#2ea043" : "#f85149"; //
            }
            if (checkbox) checkbox.checked = isActive; //
        }

        function detectSQLi(query) {
            const q = query.toLowerCase();
            const patterns = [/' OR 1=1 --/i, /admin' --/i, /union select/i]; //
            const isMalicious = patterns.some(p => p.test(q)); //
            return { isMalicious, confidence: isMalicious ? "99.8%" : "0%" }; //
        }

        function adminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            const isProtectionActive = localStorage.getItem('sqlProtectionState') === 'true'; // Read current state

            if (isProtectionActive) { //
                const analysis = detectSQLi(u + " " + p); //
                if (analysis.isMalicious) { //
                    logAttack(u, "BLOCKED"); //
                    alert("🚨 SQL PROTECTION ACTIVE: Attack Blocked!"); //
                    return;
                }
            }

            const isBypass = u.includes("' OR 1=1"); //
            if ((u === 'admin' && p === 'admin123') || isBypass) { //
                if (isBypass) logAttack(u, "ALLOWED (Vulnerable)"); //
                localStorage.setItem('adminSession', 'active');
                showDashboard();
            } else {
                alert("ACCESS DENIED");
            }
        }

        function logAttack(query, status) {
            const attack = { time: new Date().toLocaleTimeString(), ip: "192.168.1.105", query, status };
            let logs = JSON.parse(localStorage.getItem('simulatedAttacks')) || [];
            logs.push(attack);
            localStorage.setItem('simulatedAttacks', JSON.stringify(logs));
        }

        function showDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'grid';
            loadUsers(); //
            startSimulation();
        }

        function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = `
                <tr><td>#100</td><td>admin</td><td>$2b$12$K9R...</td><td>System Admin</td><td style="color:#2ea043">Active</td></tr>
                <tr><td>#201</td><td>mounika</td><td>$2b$10$e9x...</td><td>Hyderabad, India</td><td style="color:#2ea043">Active</td></tr>
            `; //
        }

        function startSimulation() {
            setInterval(() => {
                let attacks = JSON.parse(localStorage.getItem('simulatedAttacks')) || [];
                if (attacks.length > 0) {
                    const a = attacks.shift();
                    addLogToUI(a);
                    localStorage.setItem('simulatedAttacks', JSON.stringify(attacks));
                    if (a.status === "BLOCKED") blockedThreats++;
                    totalRequests++;
                    document.getElementById('totalReq').innerText = totalRequests;
                    document.getElementById('blockedReq').innerText = blockedThreats;
                }
            }, 1000);
        }

        function addLogToUI(a) {
            const row = `<tr><td>${a.time}</td><td>${a.ip}</td><td>${a.query}</td><td>CRITICAL</td><td style="color:${a.status.includes('BLOCKED')?'#f85149':'#2ea043'}">${a.status}</td></tr>`;
            document.getElementById('realtimeLogBody').insertAdjacentHTML('afterbegin', row);
            document.getElementById('logBody').insertAdjacentHTML('afterbegin', row);
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
        }

        function adminLogout() { localStorage.removeItem('adminSession'); window.location.reload(); }
    </script>
</body>
</html>
