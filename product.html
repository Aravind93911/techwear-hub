<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Details - TechWear Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Detail Page Specifics */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    .detail-img { width: 100%; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .specs-box { background: #161b22; padding: 1.5rem; border-radius: 8px; margin-top: 2rem; border: 1px solid #30363d; }
    
    /* Responsive adjustment */
    @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="container-fluid">
    <ul><li><strong>TechWear Hub</strong></li></ul>
    <ul id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
  </nav>

  <main class="container" style="padding-top: 3rem;">
    
    <a href="shop.html" style="text-decoration: none; color: var(--muted-color);">← Back to Shop</a>
    
    <div class="detail-grid" style="margin-top: 1rem;">
        <div>
            <img id="detailImage" src="" alt="Product Image" class="detail-img">
        </div>

        <div>
            <h1 id="detailName" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Loading...</h1>
            <h2 id="detailPrice" style="color: var(--primary);">$0.00</h2>
            <p id="detailDesc" style="font-size: 1.1rem; line-height: 1.6;">Loading description...</p>
            
            <button id="detailAddBtn" class="contrast" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">Add to Cart</button>

            <div class="specs-box">
                <h4>Technical Specifications</h4>
                <ul id="detailSpecs">
                    </ul>
            </div>
        </div>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
